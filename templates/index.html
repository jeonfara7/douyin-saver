<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douyin Video Downloader (No Watermark)</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#e11d48">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">
    <!-- Header -->
    <header class="w-full py-6 px-6 border-b border-slate-800 flex justify-between items-center max-w-5xl mx-auto">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black bg-gradient-to-r from-rose-500 to-amber-500 bg-clip-text text-transparent">DouyinSaver</span>
            <span class="text-xs bg-slate-800 text-slate-400 py-1 px-2 rounded-full font-mono">No Watermark</span>
        </div>
        <div class="text-sm text-slate-400">Fast & Free</div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 max-w-3xl mx-auto w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">Download Douyin Videos</h1>
            <p class="text-slate-400 text-lg">Paste your Douyin link below to download HD videos without watermark.</p>
        </div>

        <!-- Input Box Card -->
        <div class="w-full bg-slate-900 border border-slate-800 p-4 md:p-6 rounded-2xl shadow-2xl mb-8">
            <form id="download-form" class="flex flex-col md:flex-row gap-3">
                <input 
                    type="url" 
                    id="url-input" 
                    placeholder="Paste Douyin link here (e.g., https://v.douyin.com/...)" 
                    required
                    class="flex-grow bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 text-base"
                >
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-semibold px-8 py-3.5 rounded-xl transition duration-200 shadow-lg flex items-center justify-center space-x-2 cursor-pointer"
                >
                    <span>Download</span>
                </button>
            </form>
        </div>

        <!-- Adsterra Banner 300x250 (kode per-domain) -->
        <div class="w-full flex justify-center mb-8">
            <div style="width:300px;height:250px;">
                <script>
                    (function () {
                        var isDigitcuan = location.hostname.indexOf('douyin.digitcuan.site') !== -1;
                        var bannerKey = isDigitcuan ? '0c0c17e954032c7867a6c4d91f454196' : 'b6113a1ab73c3e0350ccd7ba5c4ed4e4';
                        document.write('<script>atOptions = {\'key\' : \'' + bannerKey + '\', \'format\' : \'iframe\', \'height\' : 250, \'width\' : 300, \'params\' : {}};<\/script>');
                        document.write('<script src="https://bellnewyork.org/22/' + bannerKey + '"><\/script>');
                    })();
                </script>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden flex flex-col items-center space-y-3 mb-8">
            <div class="w-10 h-10 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-400 text-sm">Fetching video without watermark...</p>
        </div>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden w-full bg-red-950/50 border border-red-800 text-red-200 p-4 rounded-xl mb-8 text-center">
            <span id="error-message"></span>
        </div>

        <!-- Result Card -->
        <div id="result-card" class="hidden w-full bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl flex flex-col md:flex-row gap-6 items-center">
            <div class="w-full md:w-1/3 flex justify-center">
                <img id="result-cover" src="" alt="Video Cover" class="rounded-xl object-cover h-64 w-full md:w-auto shadow-md border border-slate-800">
            </div>
            <div class="w-full md:w-2/3 flex flex-col space-y-4">
                <div>
                    <h3 id="result-title" class="text-lg font-bold text-slate-100 line-clamp-2 mb-2"></h3>
                    <p id="result-author" class="text-sm text-slate-400 flex items-center space-x-2"><span>Author: </span><span class="text-slate-200 font-medium"></span></p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 pt-4">
                    <a 
                        id="download-btn-hd" 
                        href="#" 
                        class="flex-grow bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-xl text-center transition duration-200 shadow-md flex items-center justify-center space-x-2"
                    >
                        <span>Download HD (No Watermark)</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 DouyinSaver. Built for speed and efficiency.
    </footer>

    <script>
        const form = document.getElementById('download-form');
        const urlInput = document.getElementById('url-input');
        const loading = document.getElementById('loading');
        const errorAlert = document.getElementById('error-alert');
        const errorMessage = document.getElementById('error-message');
        const resultCard = document.getElementById('result-card');
        const resultCover = document.getElementById('result-cover');
        const resultTitle = document.getElementById('result-title');
        const resultAuthor = document.getElementById('result-author').querySelector('span:nth-child(2)');
        const downloadBtnHd = document.getElementById('download-btn-hd');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            // Reset UI
            loading.classList.remove('hidden');
            errorAlert.classList.add('hidden');
            resultCard.classList.add('hidden');

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                loading.classList.add('hidden');

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to download video.');
                }

                if (data.success) {
                    resultTitle.textContent = data.title;
                    resultAuthor.textContent = data.author;
                    resultCover.src = data.cover || 'https://via.placeholder.com/300x500?text=No+Cover';
                    downloadBtnHd.href = '/download?url=' + encodeURIComponent(data.video_url) + '&name=douyin-' + data.aweme_id + '.mp4';
                    resultCard.classList.remove('hidden');
                } else {
                    throw new Error('Invalid response from server.');
                }
            } catch (err) {
                loading.classList.add('hidden');
                errorMessage.textContent = err.message;
                errorAlert.classList.remove('hidden');
            }
        });
    </script>

    <!-- Adsterra Social Bar (kode per-domain) -->
    <script>
        (function () {
            var isDigitcuan = location.hostname.indexOf('douyin.digitcuan.site') !== -1;
            var s = document.createElement('script');
            s.setAttribute('data-cfasync', 'false');
            s.src = isDigitcuan ? 'https://bellnewyork.org/14/5edf3692f2ecff6acd50a9e7395c5b74' : 'https://bellnewyork.org/14/d212b0df6445a6c51e1fdd91a7135756';
            document.body.appendChild(s);
        })();
    </script>
</body>
</html>
